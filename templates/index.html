<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🏥 Hospital Management System</span>
    </div>
</nav>

<!-- Dashboard -->
<div class="container mt-5">

    <div class="row text-center">

        <div class="col-md-3">
            <a href="/add_patient" class="text-decoration-none">
                <div class="card shadow p-4 bg-primary text-white">
                    <h4>➕ Add Patient</h4>
                </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="/add_doctor" class="text-decoration-none">
                <div class="card shadow p-4 bg-success text-white">
                    <h4>👨‍⚕️ Add Doctor</h4>
                </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="/view" class="text-decoration-none">
                <div class="card shadow p-4 bg-warning text-dark">
                    <h4>📋 View Patients</h4>
                </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="/appointment" class="text-decoration-none">
                <div class="card shadow p-4 bg-danger text-white">
                    <h4>📅 Appointment</h4>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
