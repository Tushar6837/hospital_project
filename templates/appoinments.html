{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>📋 Appointment List</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Date</th>
            <th>Time</th>
        </tr>

        {% for a in data %}
        <tr>
            <td>{{ a[0] }}</td>
            <td>{{ a[1] }}</td>
            <td>{{ a[2] }}</td>
            <td>{{ a[3] }}</td>
            <td>{{ a[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
