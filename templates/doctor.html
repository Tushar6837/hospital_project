{% extends 'base.html' %}

{% block content %}

<div class="card">
    <h2>🩺 Doctor List</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Specialization</th>
        </tr>

        {% for d in doctors %}
        <tr>
            <td>{{ d[0] }}</td>
            <td>{{ d[1] }}</td>
            <td>{{ d[2] }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

{% endblock %}
