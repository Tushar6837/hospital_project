<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="navbar">🏥 Hospital Management System</div>

<div class="container">
    <div class="card">

        <h2>Doctor List</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialization</th>
            </tr>

            {% for d in doctors %}
            <tr>
                <td>{{ d[0] }}</td>
                <td>{{ d[1] }}</td>
                <td>{{ d[2] }}</td>
            </tr>
            {% endfor %}
        </table>

    </div>
</div>

</body>
</html>
