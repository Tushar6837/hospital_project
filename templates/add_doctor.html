{% extends 'base.html' %}

{% block content %}

<div class="card">
    <h2>👨‍⚕️ Add Doctor</h2>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" placeholder="Enter doctor name" required>

        <label>Specialization</label>
        <input type="text" name="specialization" placeholder="Enter specialization (e.g. Cardiologist)" required>

        <button type="submit">Add Doctor</button>

    </form>
</div>

{% endblock %}
